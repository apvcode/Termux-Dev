[versions]
agp = "8.9.3"
kotlin = "2.1.21"
composeBom = "2025.05.01"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
lifecycle = "2.9.0"
coil = "3.2.0"
profileinstaller = "1.4.1"
okhttp = "4.12.0"
coroutines = "1.9.0"
commonmark = "0.24.0"
jlatexmath = "0.2.0"
junit = "4.13.2"
haze = "1.7.1"
camerax = "1.4.2"
pdfbox = "2.0.27.0"
compress = "1.27.1"
xz = "1.10"
apksig = "8.9.3"
jsoup = "1.18.1"
orgjson = "20240303"
zxing = "3.5.3"

[libraries]
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
jlatexmath = { module = "ru.noties:jlatexmath-android", version.ref = "jlatexmath" }
jlatexmath-greek = { module = "ru.noties:jlatexmath-android-font-greek", version.ref = "jlatexmath" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
org-json = { module = "org.json:json", version.ref = "orgjson" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "compress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }

[plugins]
chaquopy = { id = "com.chaquo.python", version = "17.0.0" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
