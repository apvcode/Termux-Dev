<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="DEVX: the terminal-native AI coding agent">
  <title>DEVX - the terminal-native AI coding agent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <clipPath id="card"><rect x="1.5" y="1.5" width="997" height="277" rx="18"/></clipPath>
  </defs>
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
  </g>
  <rect x="1.5" y="1.5" width="997" height="277" rx="18" fill="none" stroke="#23252c" stroke-width="1.5"/>
  <text x="500.0" y="70" text-anchor="middle" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#7d8896">THE TERMINAL-NATIVE AI CODING AGENT<tspan dx="16" fill="#2fe3ee" font-weight="700">v1.9.8</tspan></text>
  <g>
    <text x="500.0" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="112" font-weight="800" letter-spacing="14" fill="#2fe3ee">DEVX</text>
  </g>
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20">
    <text x="338" y="238" fill="#2fe3ee" font-weight="700">❯</text>
    <text x="364" y="238" fill="#c9d3df">npm install -g termux-dev</text>
  </g>
  <rect class="cursor" x="668" y="221" width="12" height="22" fill="#2fe3ee"/>
</svg>
