  <text x="44.8" y="512.0" class="t sp f5" style="animation-delay:0.40s" fill="#5ed3e0">⠴</text>
  <text x="44.8" y="512.0" class="t sp f6" style="animation-delay:0.48s" fill="#5ed3e0">⠦</text>
  <text x="44.8" y="512.0" class="t sp f7" style="animation-delay:0.56s" fill="#5ed3e0">⠧</text>
  <text x="44.8" y="512.0" class="t sp f8" style="animation-delay:0.64s" fill="#5ed3e0">⠇</text>
  <text x="44.8" y="512.0" class="t sp f9" style="animation-delay:0.72s" fill="#5ed3e0">⠏</text>
  <text x="61.6" y="512.0" class="t" fill="#e5eaf1">Writing</text>
  <text x="145.6" y="512.0" class="t" fill="#5f6b7a">(12s · ↓ 1.4k tokens · ctrl+c to stop)</text>
  <text x="44.8" y="544.0" class="t" fill="#5ed3e0">●</text>
  <text x="61.6" y="544.0" class="t b" fill="#5ed3e0">agent</text>
  <text x="607.6" y="544.0" class="t" fill="#9aa6b4">deepseek-v4.1-flash · think high</text>
  <text x="44.8" y="566.0" class="t b" fill="#b794f6">❯</text>
  <text x="70.0" y="566.0" class="t" fill="#5f6b7a">Ask or describe a task…</text>
  <text x="44.8" y="588.0" class="t" fill="#9aa6b4">~/Projects/shop</text>
  <text x="607.6" y="588.0" class="t" fill="#5f6b7a">ctx</text>
  <text x="649.6" y="588.0" class="t" fill="#5ed3e0">━━━━</text>
