  <text x="380.8" y="214.0" class="t i" fill="#5f6b7a">(ctrl+p to expand)</text>
  <text x="36.4" y="244.0" class="t" fill="#5ed3e0">●</text>
  <text x="53.2" y="244.0" class="t" fill="#f4f7fb">I'll check how settings are stored, then add the toggle.</text>
  <text x="53.2" y="274.0" class="t" fill="#b794f6">◆</text>
  <text x="70.0" y="274.0" class="t b" fill="#f4f7fb">Update</text>
  <text x="128.8" y="274.0" class="t" fill="#9aa6b4">Plan &amp; Tasks</text>
