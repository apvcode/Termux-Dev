<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 658" width="100%" role="img" aria-label="The devx terminal interface">
  <title>devx terminal interface</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="924" height="642" rx="14"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace; font-size: 14px; white-space: pre; }
    .b { font-weight: 700; }
    .i { font-style: italic; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
    .sp { opacity: 0; animation: spin .8s steps(1) infinite; }
    @keyframes spin { 0% { opacity: 1 } 10% { opacity: 0 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none } .sp { animation: none } .sp.f0 { opacity: 1 } }
  </style>
  <rect x="8" y="8" width="924" height="642" rx="14" fill="#000000"/>
  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="924" height="34" fill="#0b0b0d"/>
    <rect x="8" y="41" width="924" height="1" fill="#1a1a1f"/>
  </g>
  <rect x="8.5" y="8.5" width="923" height="641" rx="14" fill="none" stroke="#23252c"/>
