  <text x="112.0" y="62.0" class="t" fill="#5f6b7a">v1.9.8</text>
  <text x="61.6" y="106.0" class="t" fill="#5f6b7a">model</text>
  <text x="128.8" y="106.0" class="t" fill="#e5eaf1">deepseek-v4.1-flash · think high</text>
  <text x="406.0" y="106.0" class="t" fill="#5f6b7a">/model</text>
  <text x="61.6" y="128.0" class="t" fill="#5f6b7a">cwd</text>
  <text x="128.8" y="128.0" class="t" fill="#e5eaf1">~/Projects/shop</text>
  <text x="36.4" y="156.0" class="t b" fill="#b794f6">tip</text>
  <text x="78.4" y="156.0" class="t" fill="#9aa6b4">/rewind goes back to one of your messages</text>
  <text x="36.4" y="186.0" class="t b" fill="#b794f6">❯</text>
  <text x="53.2" y="186.0" class="t" fill="#e5eaf1">add a dark mode toggle to the settings page</text>
