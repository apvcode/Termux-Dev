  <text x="448.0" y="296.0" class="t" fill="#9aa6b4">1/3</text>
  <text x="78.4" y="318.0" class="t" fill="#4ade80">[✓]</text>
  <text x="112.0" y="318.0" class="t" fill="#5f6b7a">read the settings module</text>
  <text x="78.4" y="340.0" class="t b" fill="#b794f6">[•]</text>
  <text x="112.0" y="340.0" class="t b" fill="#f4f7fb">add the toggle and persist it</text>
  <text x="78.4" y="362.0" class="t" fill="#5f6b7a">[ ]</text>
  <text x="112.0" y="362.0" class="t" fill="#e5eaf1">run the tests</text>
  <text x="53.2" y="392.0" class="t" fill="#b794f6">◆</text>
  <text x="70.0" y="392.0" class="t b" fill="#f4f7fb">Read</text>
  <text x="120.4" y="392.0" class="t" fill="#e5eaf1">src/settings.ts</text>
  <text x="70.0" y="414.0" class="t" fill="#5f6b7a">╰</text>
  <text x="86.8" y="414.0" class="t" fill="#9aa6b4">84 lines</text>
  <text x="53.2" y="436.0" class="t" fill="#b794f6">◆</text>
  <text x="70.0" y="436.0" class="t b" fill="#f4f7fb">Run</text>
  <text x="112.0" y="436.0" class="t" fill="#e5eaf1">npm test</text>
  <text x="70.0" y="458.0" class="t" fill="#5f6b7a">╰</text>
